<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <title>Telemed Secure — Tableau de bord</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body id="dashboard-page">
    <main class="dashboard-container">
        <header class="dash-header">
            <div>
                <h2>Telemed Secure</h2>
                <p>Espace de santé sécurisé</p>
            </div>
            <div class="user-actions">
                <span id="user-display" class="user-display">Chargement…</span>
                <button id="logout-button" type="button" class="btn btn-danger">Déconnexion</button>
            </div>
        </header>
        <p id="dashboard-message" class="status-message" role="status" aria-live="polite"></p>
        <section id="role-content" class="card-grid" aria-live="polite"></section>
    </main>
</body>
</html>
