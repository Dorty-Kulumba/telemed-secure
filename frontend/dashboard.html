<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemed Secure - Tableau de bord</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <div class="dash-header">
            <div>
                <h2>Telemed Secure</h2>
                <p>Espace de santé & Gouvernance de Sécurité</p>
            </div>
            <div>
                <span id="user-display">Chargement...</span>
                <button onclick="logout()" class="btn btn-danger" style="margin-left: 15px;">Déconnexion</button>
            </div>
        </div>

        <div id="role-content">
            <!-- Le contenu spécifique au rôle (Patient, Médecin, Admin) sera inséré ici -->
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Charger le profil au démarrage de la page dashboard
        window.addEventListener('DOMContentLoaded', () => {
            initDashboard();
        });
    </script>
</body>
</html>
